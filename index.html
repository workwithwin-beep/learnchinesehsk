<title>HSK 6 จุดสังเกต</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mali:wght@500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>
/* Layout: a marked exam sheet — question on the left, teacher's margin notes (or the exam clock) on the right, pen controls pinned at the bottom */
:root {
  --paper: #F3F5F2;
  --sheet: #FFFFFF;
  --ink: #1D232C;
  --muted: #8A919C;
  --faint: #C9CEC9;
  --rule: #E2E6E2;
  --pen: #C7362B;
  --pen-soft: rgba(199, 54, 43, .09);
  --marker: rgba(255, 206, 0, .55);
  --chip: #E8EBE6;
  --ok: #2F7D4F;
  --ok-soft: rgba(47, 125, 79, .1);
  --warn: #B26A00;
  --gold: #B88A00;
  --f-zh: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --f-ui: "IBM Plex Sans Thai", "Leelawadee UI", "Tahoma", sans-serif;
  --f-note: "Mali", "IBM Plex Sans Thai", "Leelawadee UI", sans-serif;
  --f-pen: "Caveat", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111519; --sheet: #191E24; --ink: #E5E8EB; --muted: #7E8693; --faint: #3A424C; --rule: #2A3139;
  --pen: #FF6F5F; --pen-soft: rgba(255, 111, 95, .12); --marker: rgba(255, 206, 0, .27); --chip: #232A31;
  --ok: #5CC489; --ok-soft: rgba(92, 196, 137, .12); --warn: #F0A847; --gold: #E8B84A; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #111519; --sheet: #191E24; --ink: #E5E8EB; --muted: #7E8693; --faint: #3A424C; --rule: #2A3139;
  --pen: #FF6F5F; --pen-soft: rgba(255, 111, 95, .12); --marker: rgba(255, 206, 0, .27); --chip: #232A31;
  --ok: #5CC489; --ok-soft: rgba(92, 196, 137, .12); --warn: #F0A847; --gold: #E8B84A; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.6; }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, .opt:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top */
.top { padding-block: 18px 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.brand { font-weight: 600; font-size: 17px; letter-spacing: .01em; display: flex; align-items: baseline; gap: 8px }
.brand em { font-family: var(--f-pen); font-style: normal; color: var(--pen); font-size: 26px; line-height: 1 }
.modes { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; background: var(--sheet) }
.modes button { border: 0; background: transparent; padding: 4px 14px; border-radius: 999px; font-size: 13.5px }
.modes button[aria-pressed="true"] { background: var(--pen); color: #fff; font-weight: 600 }
.papers { display: flex; flex-wrap: wrap; gap: 6px; }
.paper-chip { border: 1px solid var(--rule); background: transparent; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-variant-numeric: tabular-nums; }
.paper-chip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink) }
.paper-chip:disabled { opacity: .45; cursor: default }

/* question nav */
.qnav { display: flex; flex-wrap: wrap; gap: 6px 14px; padding-block: 6px 14px; }
.qgroup { display: flex; align-items: center; gap: 3px; flex-wrap: wrap }
.qgroup span { font-size: 11px; color: var(--muted); letter-spacing: .06em; margin-right: 4px; font-family: var(--f-zh) }
.qbtn { position: relative; width: 28px; height: 26px; border: 0; border-radius: 5px; background: var(--chip); font-size: 12px; font-variant-numeric: tabular-nums; padding: 0 }
.qbtn.seen { box-shadow: inset 0 -2px 0 var(--pen) }
.qbtn.answered { background: var(--ink); color: var(--sheet) }
.qbtn.flag::after { content: ""; position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); border: 2px solid var(--paper) }
.qbtn[aria-current="true"] { background: var(--pen); color: #fff }

/* sheet */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 60vh; }
.main { padding: 26px 34px 40px; min-width: 0; border-right: 1px dashed var(--rule) }
.qhead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 18px }
.qno { font-family: var(--f-pen); font-size: 54px; line-height: .8; color: var(--pen); font-variant-numeric: tabular-nums }
.qpart { font-family: var(--f-zh); font-weight: 600; font-size: 15px }
.qpart small { display: block; font-family: var(--f-ui); font-weight: 400; color: var(--muted); font-size: 13px }

.content { position: relative; font-family: var(--f-zh); font-size: 18px; line-height: 2.05; }
.content p { margin: 0 0 .5em; text-indent: 2em }
.ink { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 2 }
.ink path { fill: none; stroke: var(--pen); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round }
.ink .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .7s .35s cubic-bezier(.6,.1,.3,1) forwards }
.ink .badge circle { fill: var(--pen) }
.ink .badge text { fill: #fff; font: 700 13px var(--f-ui); text-anchor: middle; dominant-baseline: central }
.ink .badge.pop { transform-box: fill-box; transform-origin: center; animation: pop .45s .25s both cubic-bezier(.3,1.6,.5,1) }
@keyframes draw { to { stroke-dashoffset: 0 } }
@keyframes pop { from { transform: scale(0); opacity: 0 } }

.txt { transition: color .4s }
.focus .txt { color: var(--muted) }
mark { color: inherit; background: linear-gradient(var(--marker), var(--marker)) no-repeat 0 62% / 100% 58%; padding: 0 1px; border-radius: 2px }
.focus mark { color: var(--ink) }
mark.sweep { animation: sweep .55s cubic-bezier(.5,0,.2,1) both }
@keyframes sweep { from { background-size: 0% 58% } }
mark.speaking { box-shadow: 0 2px 0 var(--pen) }

.passage { margin-bottom: 18px }
.blank { display: inline-block; min-width: 3.2em; border-bottom: 1.5px solid var(--faint); text-align: center; text-indent: 0; line-height: 1.5; margin: 0 2px; font-family: var(--f-ui); font-size: 13px; color: var(--muted); vertical-align: baseline }
.blank.cur { border-color: var(--pen); color: var(--pen); font-weight: 600; background: var(--pen-soft); border-radius: 3px 3px 0 0; padding: 0 6px }
.blank.filled { font-family: var(--f-zh); font-size: 17px; color: var(--pen); font-weight: 600; border-color: var(--pen); animation: drop .5s both cubic-bezier(.3,1.4,.5,1) }
.blank.filled.long { min-width: 0; padding: 0 4px }
.blank.picked { color: var(--ink); font-weight: 600 }
@keyframes drop { from { transform: translateY(-10px); opacity: 0 } }

.stem { font-weight: 600; margin: 8px 0 6px; padding-top: 14px; border-top: 1px solid var(--rule) }
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px }
.opt { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: baseline; padding: 4px 8px 4px 0; border-radius: 6px; transition: opacity .5s, background .25s }
.exam .opt { cursor: pointer; border: 1px solid transparent }
.exam .opt:hover { background: var(--chip) }
.opt.chosen { background: var(--chip); border-color: var(--ink) !important }
.opt.chosen .lt { color: var(--sheet) }
.opt.chosen .lt::before { content: ""; position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; transform: translate(-50%, -50%); border-radius: 50%; background: var(--ink); z-index: -1 }
.lt { position: relative; z-index: 0; font-family: var(--f-ui); font-weight: 600; font-size: 15px; color: var(--muted); text-align: center }
.lt svg { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; transform: translate(-50%, -52%); overflow: visible; display: none }
.lt svg path { fill: none; stroke: var(--pen); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 120; stroke-dashoffset: 120 }
.opt.correct { background: var(--pen-soft) }
.opt.correct .lt { color: var(--pen) }
.opt.correct .lt svg { display: block }
.opt.correct .lt svg path { animation: draw .6s cubic-bezier(.6,.1,.3,1) forwards }
.opt.wrong { opacity: .35 }
.words { display: flex; flex-wrap: wrap; gap: 4px 18px }
.words i { font-style: normal }
.words i b { font-family: var(--f-ui); font-size: 11px; color: var(--muted); font-weight: 500; margin-right: 3px }

/* margin notes */
.notes { padding: 26px 22px 40px; min-width: 0; font-family: var(--f-note); font-size: 14.5px; line-height: 1.65 }
.notes h3 { margin: 0 0 12px; font-family: var(--f-ui); font-size: 12px; font-weight: 500; letter-spacing: .08em; color: var(--muted) }
.tip { color: var(--muted); font-size: 13.5px; margin: 0 0 16px }
.nlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px }
.note { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; color: var(--pen) }
.note b { width: 22px; height: 22px; border-radius: 50%; background: var(--pen); color: #fff; font: 700 12px/22px var(--f-ui); text-align: center }
.note.old { color: var(--ink); opacity: .7 }
.note.new { animation: slide .5s .5s both cubic-bezier(.2,.8,.3,1) }
@keyframes slide { from { transform: translateX(14px); opacity: 0 } }
.answer { margin-top: 18px; padding: 12px 14px; border: 2px solid var(--pen); border-radius: 10px 14px 9px 13px; color: var(--pen); animation: stamp .45s both cubic-bezier(.3,1.5,.5,1); }
.answer strong { font-family: var(--f-pen); font-size: 34px; line-height: 1; display: block }
.answer .zh { font-family: var(--f-zh); color: var(--ink); font-size: 15px }
.answer ol { margin: 6px 0 0; padding-left: 18px; font-family: var(--f-zh); color: var(--ink); font-size: 14.5px }
@keyframes stamp { from { transform: scale(1.25) rotate(-4deg); opacity: 0 } }
.empty-note { color: var(--muted); font-family: var(--f-ui); font-size: 13.5px }
.voice-warn { font-family: var(--f-ui); font-size: 12.5px; color: var(--warn); margin: 0 0 12px; padding: 8px 10px; border: 1px solid var(--warn); border-radius: 6px }
.whys { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px }
.whys li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 6px 8px; border-radius: 8px; color: var(--muted); transition: background .3s, color .3s; animation: slide .4s both cubic-bezier(.2,.8,.3,1) }
.whys li b { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor; font: 700 12px/19px var(--f-ui); text-align: center }
.whys li.right { color: var(--pen) }
.whys li.right b { background: var(--pen); border-color: var(--pen); color: #fff }
.whys li em { font-style: normal; font-weight: 600; font-family: var(--f-ui); font-size: 12.5px; margin-right: 4px }
.whys li.speaking { background: var(--pen-soft); color: var(--ink) }
.whys li.right.speaking { color: var(--pen) }
.opt.speaking { opacity: 1 !important; box-shadow: inset 3px 0 0 var(--pen); background: var(--pen-soft) }
.opt.wrong.speaking .txt, .opt.wrong.speaking > span:last-child { text-decoration: line-through; text-decoration-color: var(--pen); text-decoration-thickness: 1.5px }

/* exam panel */
.panel { font-family: var(--f-ui); font-size: 14px; display: grid; gap: 16px; align-content: start }
.clock { font-family: var(--f-pen); font-size: 64px; line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: .02em }
.clock.low { color: var(--pen) }
.label { font-size: 11.5px; letter-spacing: .08em; color: var(--muted); font-weight: 500 }
.pace { font-weight: 600 }
.pace.ok { color: var(--ok) } .pace.slow { color: var(--pen) } .pace.fast { color: var(--ok) }
.meter { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden }
.meter i { display: block; height: 100%; background: var(--ink); transition: width .5s }
.meter.over i { background: var(--pen) }
.qtime { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums }
.coach { font-family: var(--f-note); color: var(--pen); font-size: 14px; animation: slide .4s both }
.secs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px }
.secs li { display: grid; grid-template-columns: 1fr auto; gap: 8px; color: var(--muted) }
.secs li.now { color: var(--ink); font-weight: 600 }
.secs li .n { font-variant-numeric: tabular-nums }

/* intro / results */
.page { padding: 28px 34px 40px; grid-column: 1 / -1; min-width: 0 }
.page h2 { font-family: var(--f-zh); font-size: 26px; margin: 0 0 4px; text-wrap: balance }
.page .lead { color: var(--muted); margin: 0 0 22px; max-width: 64ch }
.plan { list-style: none; padding: 0; margin: 0 0 22px; display: grid; gap: 0; border-top: 1px solid var(--rule) }
.plan li { display: grid; grid-template-columns: 92px 120px minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--rule); align-items: baseline }
.plan .t { font-family: var(--f-pen); font-size: 30px; line-height: 1; color: var(--pen); font-variant-numeric: tabular-nums }
.plan .q { font-weight: 600 }
.plan .why { color: var(--muted); font-size: 14px }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 24px; margin: 0 0 24px; padding: 0; list-style: none; font-family: var(--f-note); font-size: 14px }
.rules li::before { content: "✓ "; color: var(--pen); font-weight: 700 }
.choices { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.choices label { display: inline-flex; gap: 6px; align-items: center; font-size: 14px }
.big { font-size: 16px; padding: 10px 22px }

.score { display: flex; flex-wrap: wrap; gap: 14px 40px; align-items: flex-end; margin: 6px 0 22px }
.score .num { font-family: var(--f-pen); font-size: 72px; line-height: .85; color: var(--pen); font-variant-numeric: tabular-nums }
.score .num small { font-size: 30px; color: var(--muted) }
.score .sub { font-size: 13px; color: var(--muted) }
.band { display: grid; gap: 6px; margin: 0 0 24px; max-width: 640px }
.band .bar2 { position: relative; height: 12px; border-radius: 6px; background: var(--chip) }
.band .zone { position: absolute; top: 0; bottom: 0; left: 50%; width: 45%; background: var(--ok-soft); border-left: 2px solid var(--ok); border-right: 2px solid var(--ok) }
.band .you { position: absolute; top: -5px; width: 4px; height: 22px; border-radius: 2px; background: var(--pen); transform: translateX(-2px); transition: left .8s cubic-bezier(.2,.8,.3,1) }
.band .ticks { position: relative; height: 18px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums }
.band .ticks span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap }
.band .ticks span:first-child { transform: none }
.band .ticks span:last-child { transform: translateX(-60%) }
.rtable { width: 100%; border-collapse: collapse; margin: 0 0 24px; font-size: 14px }
.rtable th, .rtable td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--rule); vertical-align: top }
.rtable th { font-size: 11.5px; letter-spacing: .06em; color: var(--muted); font-weight: 500 }
.rtable td.num { font-variant-numeric: tabular-nums; white-space: nowrap }
.wrongs { display: flex; flex-wrap: wrap; gap: 4px }
.wrongs button { border: 0; background: var(--pen-soft); color: var(--pen); border-radius: 5px; padding: 1px 7px; font-size: 12.5px; font-variant-numeric: tabular-nums }
.wrongs button.blankq { background: var(--chip); color: var(--muted) }
.advice { font-family: var(--f-note); display: grid; gap: 10px; margin: 0 0 24px; padding: 0; list-style: none; max-width: 70ch }
.advice li { padding-left: 14px; border-left: 3px solid var(--pen) }
.tablewrap { overflow-x: auto }

textarea { width: 100%; min-height: 340px; resize: vertical; font: 18px/1.9 var(--f-zh); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 14px; }
textarea:focus { outline: 2px solid var(--pen); outline-offset: 1px }
.counter { font-variant-numeric: tabular-nums; font-weight: 600 }
.checks { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 8px; font-family: var(--f-note); font-size: 14px }
.checks label { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; align-items: start; cursor: pointer }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px }
.essay-view { font-family: var(--f-zh); white-space: pre-wrap; font-size: 16px; line-height: 1.9; border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; min-height: 120px }

/* game */
.gtop { display: flex; gap: 18px; align-items: center }
.ring { position: relative; width: 96px; height: 96px; flex: none }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.ring circle { fill: none; stroke-width: 7 }
.ring .bg { stroke: var(--chip) }
.ring .fg { stroke: var(--ink); stroke-linecap: round; stroke-dasharray: 213.6; transition: stroke-dashoffset .25s linear, stroke .3s }
.ring.low .fg { stroke: var(--pen) }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-pen); font-size: 34px; font-variant-numeric: tabular-nums }
.ring.low span { color: var(--pen); animation: pulse 1s infinite }
@keyframes pulse { 50% { transform: scale(1.12) } }
.gscore { font-family: var(--f-pen); font-size: 48px; line-height: .9; color: var(--pen); font-variant-numeric: tabular-nums }
.stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px }
.stages li { display: flex; justify-content: space-between; padding: 5px 10px; border-radius: 6px; color: var(--muted) }
.stages li b { font-variant-numeric: tabular-nums }
.stages li.past { text-decoration: line-through; opacity: .6 }
.stages li.now { background: var(--pen-soft); color: var(--pen); font-weight: 600 }
.gmsg { font-family: var(--f-note); font-size: 15px; min-height: 1.6em }
.gmsg.bad { color: var(--pen) }
.gmsg.good { color: var(--ok); font-weight: 600 }
.gwhy { font-family: var(--f-note); font-size: 14px; padding: 10px 12px; border: 2px solid var(--pen); border-radius: 10px 14px 9px 13px; animation: stamp .45s both cubic-bezier(.3,1.5,.5,1) }
.gwhy strong { font-family: var(--f-pen); font-size: 30px; color: var(--pen); display: block; line-height: 1 }
.opt.struck { opacity: .45; pointer-events: none }
.opt.struck .lt { color: var(--pen) }
.opt.struck .lt::after { content: "✕"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; color: var(--pen) }
.opt.struck .lt { color: transparent }
.opt.struck > span:not(.lt):not(.th) { text-decoration: line-through; text-decoration-color: var(--pen) }
.opt .th { grid-column: 2; display: block; font-family: var(--f-ui); font-size: 14px; line-height: 1.5; color: var(--muted); animation: slide .45s both cubic-bezier(.2,.8,.3,1) }
.opt.struck .th { text-decoration: none }
.stem-th { font-family: var(--f-ui); font-size: 14.5px; color: var(--muted); margin: -2px 0 8px; animation: slide .45s both }
.game.flash-good .opt.correct { background: var(--ok-soft) }
.game.flash-good .opt.correct .lt { color: var(--ok) }
.game.flash-good .opt.correct .lt svg path { stroke: var(--ok) }
.speed { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; background: var(--sheet) }
.speed button { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; font-size: 13.5px }
.speed button[aria-pressed="true"] { background: var(--ink); color: var(--sheet) }
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--sheet); padding: 9px 18px; border-radius: 999px; font-size: 14.5px; font-weight: 500; box-shadow: 0 6px 24px rgba(0,0,0,.18); animation: toast 2.8s both; max-width: calc(100% - 32px); text-align: center }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -12px) } 10%, 85% { opacity: 1; transform: translate(-50%, 0) } 100% { opacity: 0 } }

/* drills */
.gcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin: 0 0 26px }
.gcard { border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; display: grid; gap: 8px; align-content: start; background: var(--sheet) }
.gcard h3 { margin: 0; font-size: 17px }
.gcard p { margin: 0; color: var(--muted); font-size: 14px }
.gcard p b { color: var(--ink) }
.gcard .zh-big { font-family: var(--f-zh); font-size: 21px }
.gcard .zh-big u { text-decoration-color: var(--pen); text-decoration-thickness: 2px; text-underline-offset: 4px }
.gcard .btn { justify-self: start }
.cd { display: grid; gap: 22px; justify-items: center; padding: 6px 0 20px }
.cd-bar { width: 100%; height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden }
.cd-bar i { display: block; height: 100%; width: 100%; background: var(--ink) }
.cd-bar.low i { background: var(--pen) }
.cd-chunk { font-family: var(--f-zh); font-size: clamp(26px, 5vw, 40px); line-height: 1.5; text-align: center; text-wrap: balance; min-height: 1.5em }
.cd-blank { display: inline-block; min-width: 2.4em; border-bottom: 3px solid var(--pen); color: var(--pen); margin: 0 6px; text-align: center }
.cd-blank.good { color: var(--ok); border-color: var(--ok); animation: drop .4s both }
.cd-blank.bad { animation: shake .4s }
@keyframes shake { 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }
.cd-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 520px }
.cd-opt { font-family: var(--f-zh); font-size: 24px; padding: 14px 10px; border: 1px solid var(--rule); border-radius: 10px; background: var(--sheet); display: flex; gap: 10px; align-items: center; justify-content: center; transition: background .2s, border-color .2s }
.cd-opt:hover:not(:disabled) { border-color: var(--ink) }
.cd-opt b { font: 600 12px var(--f-ui); color: var(--muted) }
.cd-opt.good { background: var(--ok-soft); border-color: var(--ok) }
.cd-opt.bad { background: var(--pen-soft); border-color: var(--pen); text-decoration: line-through }
.cd-opt:disabled { cursor: default }
.cd-after { font-size: 15px; text-align: center; display: grid; gap: 6px; min-height: 5em; max-width: 60ch }
.cd-after .zh { font-family: var(--f-zh); font-size: 22px }
.cd-after .zh b { color: var(--pen) }
.cd-after .full { font-family: var(--f-zh); color: var(--muted); font-size: 15px }
.sent { border-radius: 3px; transition: background .2s }
.scan .sent { cursor: pointer }
.scan .sent:hover { background: var(--chip) }
.sent.miss { background: var(--pen-soft); text-decoration: line-through; text-decoration-color: var(--pen); animation: shake .4s }
.sent.found { background: linear-gradient(var(--marker), var(--marker)) no-repeat 0 62% / 100% 58%; animation: sweep .55s both }
.para-hint { outline: 2px dashed var(--pen); outline-offset: 6px; border-radius: 4px }
mark.kw { background: none; color: inherit; box-shadow: inset 0 -2px 0 var(--pen) }
.stem-big { font-family: var(--f-zh); font-size: 18px; font-weight: 600; line-height: 1.8 }
.stem-big .kw, .stem-inline .kw { color: var(--pen); box-shadow: inset 0 -2px 0 var(--pen) }
.scan-opts button:disabled { cursor: default; color: var(--ink) }
.scan-opts { display: grid; gap: 6px }
.scan-opts button { text-align: left; border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 8px 10px; font-family: var(--f-zh); font-size: 15px }
.scan-opts button b { font-family: var(--f-ui); color: var(--muted); margin-right: 4px }
.scan-opts button.good { background: var(--ok-soft); border-color: var(--ok) }
.scan-opts button.bad { background: var(--pen-soft); border-color: var(--pen); text-decoration: line-through }
.scantime { font-family: var(--f-pen); font-size: 44px; line-height: .9; font-variant-numeric: tabular-nums }
.scantime.amber { color: var(--warn) }
.scantime.red { color: var(--pen) }
.minimap { position: relative; height: 150px; width: 30px; border-left: 3px solid var(--rule); margin: 10px 0 8px 14px }
.minimap i { position: absolute; left: -11px; width: 19px; height: 19px; border-radius: 50%; background: var(--pen); color: #fff; font: 700 10px/19px var(--f-ui); text-align: center; font-style: normal; transform: translateY(-50%) }

/* level campaign */
.lv-rules { margin-bottom: 18px }
.lvgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px }
.lvtile { position: relative; display: grid; justify-items: center; gap: 2px; padding: 12px 6px 10px; border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); transition: transform .15s, border-color .15s }
.lvtile:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--ink) }
.lvtile .tier { font-size: 10.5px; letter-spacing: .06em; color: var(--muted) }
.lvtile .n { font-family: var(--f-pen); font-size: 36px; line-height: 1; font-variant-numeric: tabular-nums }
.lvtile .stars { color: var(--gold); font-size: 17px; letter-spacing: 2px; min-height: 20px; display: flex; align-items: center }
.lvtile .tag { font-size: 11.5px; color: var(--muted) }
.lvtile.played { border-color: var(--warn) }
.lvtile.played .tag { color: var(--warn) }
.lvtile.auto { border-color: var(--gold); background: linear-gradient(var(--sheet), var(--sheet)) padding-box, linear-gradient(135deg, var(--gold), transparent) border-box; border: 2px solid transparent }
.lvtile.auto .tag { color: var(--gold); font-weight: 600 }
.lvtile.locked { opacity: .45; cursor: not-allowed }
.lvtile.locked .stars { color: var(--muted) }
.lv-bar { position: relative; width: 100%; height: 8px; background: var(--chip); border-radius: 4px; overflow: visible; margin-bottom: 10px }
.lv-bar i { display: block; height: 100%; width: 100%; border-radius: 4px; background: var(--ink) }
.lv-bar i.gold { background: var(--gold) }
.lv-bar i.low { background: var(--pen) }
.lv-bar .goldmark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--gold) }
.pips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px }
.pips i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--faint); position: relative }
.pips i.ok { background: var(--ok); border-color: var(--ok) }
.pips i.now { border-color: var(--pen) }
.pips i.half::after { content: ""; position: absolute; right: -5px; top: -3px; bottom: -3px; width: 2px; background: var(--gold) }
.lv-modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(10, 12, 16, .55); animation: fade .25s both }
@keyframes fade { from { opacity: 0 } }
.lv-box { background: var(--sheet); color: var(--ink); border-radius: 16px; padding: 26px 24px; max-width: 420px; width: 100%; text-align: center; display: grid; gap: 10px; animation: stamp .4s both cubic-bezier(.3,1.5,.5,1) }
.lv-box p { margin: 0 }
.lv-sad { font-family: var(--f-note); font-size: 34px; color: var(--pen) }
.lv-win { font-family: var(--f-note); font-size: 34px; color: var(--ok) }
.lv-stars { font-size: 40px; letter-spacing: 6px; color: var(--faint) }
.lv-stars b { color: var(--gold); font-weight: 400; display: inline-block; animation: pop .5s both cubic-bezier(.3,1.6,.5,1) }
.lv-stars b:nth-child(2) { animation-delay: .15s }
.lv-stars b:nth-child(3) { animation-delay: .3s }

/* control bar */
.bar { position: sticky; bottom: 0; z-index: 5; background: var(--paper); border-top: 1px solid var(--rule); margin-top: 18px; padding-bottom: env(safe-area-inset-bottom, 0px) }
.bar .wrap { display: flex; align-items: center; gap: 8px; padding-block: 10px; flex-wrap: wrap }
.btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 7px 12px; font-size: 14px; white-space: nowrap }
.btn.primary { background: var(--pen); border-color: var(--pen); color: #fff; font-weight: 600; min-width: 168px }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink) }
.btn:disabled { opacity: .45; cursor: default }
.dots { display: flex; gap: 5px; margin-left: auto; align-items: center }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); transition: background .3s }
.dots i.on { background: var(--pen) }
.dots i.ans { border-radius: 2px; transform: rotate(45deg) }
.miniclock { margin-left: auto; font-family: var(--f-pen); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums }
.miniclock.low { color: var(--pen) }
.keys { color: var(--muted); font-size: 12px; width: 100% }
kbd { font: 11px var(--f-ui); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px }

/* mock exam — cream and deep green, cards, one column like the official online test */
:root { --x-bg: #F6F3E8; --x-card: #FFFFFF; --x-green: #3F6E25; --x-green2: #5C8F3B; --x-soft: #E7EFDD; --x-line: #E4DFCD; --x-text: #232A1E; --x-muted: #6F7566 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --x-bg: #14170F; --x-card: #1D2217; --x-green: #8CC46A; --x-green2: #6FA84E; --x-soft: #26321D; --x-line: #2F3727; --x-text: #E6EBDD; --x-muted: #98A08C } }
:root[data-theme="dark"] { --x-bg: #14170F; --x-card: #1D2217; --x-green: #8CC46A; --x-green2: #6FA84E; --x-soft: #26321D; --x-line: #2F3727; --x-text: #E6EBDD; --x-muted: #98A08C }
/* mock exam: full-screen frame in the layout of the official online test */
html.xlock, html.xlock body { overflow: hidden }
#xov { --paper:#f5f0dd; --paper-light:#fffdf5; --ink:#1c1c1e; --muted:#6e6e73; --bamboo:#4a7526; --bamboo-dark:#325418; --bamboo-soft:#e5edd9; --vermilion:#d76936; --vermilion-dark:#ae4825; --line:#00000014;
  --fs-xs:clamp(10px,2.67vw,12px); --fs-sm:clamp(12px,3.2vw,14px); --fs-base:clamp(13px,3.47vw,15px); --fs-md:clamp(15px,4vw,17px); --fs-lg:clamp(17px,4.53vw,20px); --fs-xl:clamp(20px,5.33vw,24px); --fs-2xl:clamp(24px,6.4vw,30px);
  --num:"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",ui-monospace,monospace; --ease:cubic-bezier(.25,1,.5,1);
  --card-bg:#fffffdd1; --card-border:#ffffffe6; --card-shadow:0 10px 30px #0000000a,0 2px 8px #00000005; --ctrl-h:clamp(48px,11.5vw,52px);
  --e-paper:#f5f4ef; --e-surface:#fffefa; --e-ink:#19231d; --e-muted:#6d756f; --e-green:#24543a; --e-green-deep:#173f2a; --e-sage:#e8ede7; --e-line:#d9ddd8; --e-accent:#b94f31;
  position: fixed; inset: 0; z-index: 900; display: flex; justify-content: center; color: var(--ink);
  font-family: -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI",sans-serif; -webkit-font-smoothing: antialiased;
  background: radial-gradient(circle at 15% 10%, #4a75261a, #0000 40%), radial-gradient(circle at 85% 90%, #d769361a, #0000 40%), var(--paper) }
#xov button, #xov input, #xov textarea { font: inherit; color: inherit }
#xov svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none }
.xf { position: relative; width: min(100%, 460px); height: 100%; overflow: hidden; background: radial-gradient(at 50% 0, #4a752614, #0000 60%), linear-gradient(#fbfbf8, #f5f4ec); box-shadow: 0 20px 60px #0000001f, 0 1px 3px #0000000d }
/* pre-exam screens */
.xs { height: 100%; display: flex; flex-direction: column; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)) }
.xbh { display: flex; align-items: center; gap: 10px; min-height: 52px; margin: 0 0 14px; border-bottom: 1px solid #527d2a29 }
.xmark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: linear-gradient(#4b8229, var(--bamboo)); color: #fff; font: 800 10px var(--num); letter-spacing: .02em; box-shadow: 0 4px 12px #38661d40 }
.xmark.sm { width: 28px; height: 28px; border-radius: 8px; font-size: 8px }
.xbt { flex: 1; display: grid; font-size: var(--fs-sm); font-weight: 700; color: var(--bamboo-dark); line-height: 1.25 } .xbt small { font-size: var(--fs-xs); color: var(--muted); font-weight: 500 }
.xclose { width: 36px; height: 36px; border-radius: 50%; border: 0; background: #0000000a; display: grid; place-items: center; cursor: pointer; color: var(--muted) }
.xsb { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-bottom: 8px; margin: 0 -4px; padding-inline: 4px }
.xkick { margin: 0; color: var(--bamboo); font-size: var(--fs-xs); letter-spacing: .14em; font-weight: 700; text-transform: uppercase }
.xtitle { margin: -6px 0 0; font-size: var(--fs-xl); font-weight: 700; letter-spacing: -.015em; line-height: 1.25 }

.xentry { display: flex; flex-direction: column; gap: 14px; padding-top: 4vh }
.xentry .xtitle { font-size: var(--fs-2xl); margin: 0 }
.xlang { display: grid; gap: 3px; text-align: left; padding: 16px 18px; border-radius: 20px; background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: var(--card-shadow); cursor: pointer; transition: transform .2s var(--ease) }
.xlang b { font-size: var(--fs-md); color: var(--bamboo-dark) } .xlang small { color: var(--muted); font-size: var(--fs-sm) }
.xlang:active { transform: scale(.98) }
.xpend, .xhist { display: grid; gap: 8px; padding: 14px 16px; border-radius: 20px; background: var(--card-bg); border: 1px solid #4a752640; box-shadow: var(--card-shadow); font-size: var(--fs-sm) }
.xpend span { color: var(--muted) } .xpend-a { display: flex; gap: 8px } .xpend-a .xb { flex: 1; min-height: 42px }
.xhist p { margin: 0; display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted #ccd1c6; padding-bottom: 6px } .xhist p span { color: var(--muted) }
.xfoot { margin: auto 0 0; text-align: center; color: var(--muted); font-size: var(--fs-xs) }
.xpa { display: flex; flex-direction: column; gap: 10px; padding-top: 12px }
.xpa.split { flex-direction: row } .xpa.split .xb { flex: 1 }
.xb { min-height: var(--ctrl-h); border-radius: 16px; font-weight: 600; font-size: var(--fs-md); padding: 14px 26px; border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .2s var(--ease), opacity .2s }
.xb:active:not(:disabled) { transform: scale(.98) }
.xb:disabled { opacity: .42; cursor: default; box-shadow: none }
.xb-primary { color: #fff !important; background: linear-gradient(#4b8229, #38661d); box-shadow: 0 4px 16px #38661d47, inset 0 1px #fff3 }
.xb-secondary { color: var(--bamboo-dark) !important; background: #fffffde0; border: 1px solid #4a752640 }

.xb-sm { min-height: 40px; padding: 8px 14px; font-size: var(--fs-sm); border-radius: 12px; justify-self: start }
.xcc { display: grid; grid-template-columns: 38px 1fr; gap: 0 12px; padding: 16px; border-radius: 20px; background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: var(--card-shadow) }
.xcc > div { display: grid; gap: 8px; min-width: 0 }
.xcc h2 { margin: 4px 0 0; font-size: var(--fs-md) } .xcc p { margin: 0; color: var(--muted); font-size: var(--fs-sm); line-height: 1.55 }
.xcc audio { width: 100%; height: 36px }
.xcn { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(#4b8229, var(--bamboo)); color: #fff; font: 700 13px var(--num) }
.xform { display: grid; gap: 16px; padding: 18px 16px; border-radius: 20px; background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: var(--card-shadow) }
.xfield { display: grid; gap: 7px } .xfield > span { font-size: var(--fs-sm); font-weight: 600 } .xfield i { color: var(--vermilion); font-style: normal; margin-right: 2px }
.xfield input, .xpick { min-height: 44px; border-radius: 12px; background: #eef3e8c7; border: 1px solid #4a752629; padding: 0 14px; font-size: var(--fs-base); outline: none; width: 100% }
.xfield input:focus { border-color: var(--bamboo); box-shadow: 0 0 0 3px #4a752629 } .xfield input.err { border-color: #ff3b30 }
.xpick { display: flex; align-items: center; justify-content: space-between; cursor: pointer; text-align: left }
.xpc { display: grid; grid-template-columns: 92px 1fr; gap: 16px; padding: 18px; border-radius: 24px; background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: var(--card-shadow) }
.xph { width: 92px; height: 116px; border-radius: 14px; border: 4px solid #fff; box-shadow: 0 4px 12px #0000001a; background: linear-gradient(150deg, #cbd8bd, #849b6a); display: grid; place-items: center; color: #fff; font: 600 40px KaiTi, STKaiti, serif }
.xpc dl { margin: 0; display: grid; grid-template-columns: auto 1fr; align-content: start; font-size: var(--fs-sm) }
.xpc dt, .xpc dd { margin: 0; padding: 8px 0; border-bottom: 1px dotted #ccd1c6 } .xpc dt { color: var(--muted); padding-right: 12px } .xpc dd { font-weight: 700; text-align: right }
.xinst { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px; padding: 18px 16px; border-radius: 20px; background: var(--card-bg); box-shadow: var(--card-shadow) }
.xtrack { height: 10px; border-radius: 99px; background: var(--bamboo-soft); overflow: hidden }
.xtrack span { display: block; height: 100%; border-radius: 99px; transition: width .15s; background: repeating-linear-gradient(45deg, #4b8229 0 8px, #5a9134 8px 16px) }
.xpv { font: 700 var(--fs-2xl) var(--num); color: var(--bamboo-dark) }
.xkey summary { cursor: pointer; color: var(--muted); font-size: var(--fs-sm) } .xkey { display: grid; gap: 8px }
.xkey textarea { width: 100%; border-radius: 12px; background: #eef3e8c7; border: 1px solid #4a752629; padding: 10px; font-family: var(--num) }
.xnote { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--bamboo-soft); font-size: var(--fs-sm); line-height: 1.6; font-weight: 600; color: var(--bamboo-dark) }
.xsec { margin: 4px 0 0; font-size: var(--fs-md) }
.xil { margin: 0; padding: 0; list-style: none; border-radius: 20px; background: var(--card-bg); box-shadow: var(--card-shadow); padding: 4px 16px }
.xil li { display: grid; grid-template-columns: 44px 1fr; padding: 12px 0; border-bottom: 1px solid var(--line) } .xil li:last-child { border: 0 }
.xil li span { color: var(--vermilion); font: 700 var(--fs-md) var(--num) } .xil li p { margin: 0; font-size: var(--fs-base); line-height: 1.65 }
.xvc { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px; border-radius: 16px; background: #fffffdbd; border: 1px solid #4a752633; font-weight: 650; cursor: pointer; transition: background .2s }
.xvc input { width: 20px; height: 20px; accent-color: var(--bamboo) } .xvc.on { background: var(--bamboo-soft); border-color: var(--bamboo) }
/* bottom sheet + dialog (shared) */
.xsheet-l, .xdl { position: absolute; inset: 0; z-index: 30; background: #1f261b7a; display: flex; animation: xfade .2s }
.xsheet-l { align-items: flex-end } .xdl { align-items: center; justify-content: center; padding: 24px }
@keyframes xfade { from { opacity: 0 } } @keyframes xup { from { transform: translateY(100%) } }
.xsheet { width: 100%; max-height: 82%; overflow-y: auto; border-radius: 28px 28px 0 0; background: var(--e-surface); padding: 8px 18px calc(18px + env(safe-area-inset-bottom, 0px)); animation: xup .32s cubic-bezier(.32,.72,0,1) }
.xhandle { width: 38px; height: 5px; border-radius: 9px; background: #0000001f; margin: 0 auto 10px }
.xsheet header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px }
.xsheet h2 { margin: 0; font: 700 22px KaiTi, STKaiti, serif } .xsheet header button { border: 0; background: #0000000a; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; cursor: pointer }
.xpapers { display: grid; gap: 8px }
.xpo { display: flex; align-items: center; gap: 10px; text-align: left; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--e-line); background: #fff; cursor: pointer }
.xpo-c { flex: 1; display: grid } .xpo small { color: var(--muted); font-size: var(--fs-xs) } .xpo.on { border-color: var(--bamboo); background: var(--bamboo-soft); color: var(--bamboo-dark) }
.xlegend { display: flex; gap: 16px; font-size: 12px; color: var(--e-muted); margin-bottom: 6px }
.xlegend span::before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--e-line); margin-right: 5px; vertical-align: -2px }
.xlegend .done::before { background: #4a752626; border-color: var(--bamboo) } .xlegend .flagged::before { content: '★'; border: 0; color: #d49322; width: auto; height: auto; line-height: 1 }
.xas { margin-top: 12px } .xash { display: flex; justify-content: space-between; color: var(--e-muted); font-size: 14px; font-weight: 700; margin-bottom: 8px }
.xag { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px }

.xag button.current { outline: 2px solid var(--vermilion); outline-offset: 1px } .xag button:disabled { opacity: .45 }
.xcd { position: relative; width: 100%; max-width: 340px; border-radius: 16px; background: #fffdf7; padding: 40px 22px 20px; text-align: center; box-shadow: 0 20px 50px #0003 }
.xsym { position: absolute; top: -27px; left: 50%; transform: translateX(-50%); width: 54px; height: 54px; border-radius: 50%; background: var(--vermilion); color: #fff; display: grid; place-items: center; font: 800 26px var(--num); border: 4px solid #fffdf7 }
.xcd h2 { margin: 0 0 8px; font: 700 22px KaiTi, STKaiti, serif } .xcd p { margin: 0 0 18px; color: var(--e-muted); font-size: 14.5px; line-height: 1.6 } .xcd b { color: var(--vermilion-dark) }
.xda { display: flex; gap: 10px } .xda .xb { flex: 1; min-height: 46px; font-size: 15px; padding: 10px }
/* exam screen */
.xe { position: absolute; inset: 0; background: var(--e-paper); color: var(--e-ink) }
.xeh { position: absolute; top: 0; left: 0; right: 0; z-index: 10; height: 94px; padding: 10px 14px 0; background: #f5f4eff5; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--e-line); display: flex; flex-direction: column; gap: 9px }
.xehb { display: flex; justify-content: space-between; align-items: center; height: 44px }
.xes { display: flex; align-items: center; gap: 10px }
.xclock { display: grid; line-height: 1.1 } .xclock span { font-size: 10px; color: var(--e-muted); font-weight: 600 }
.xclock strong { font: 700 22px var(--num); letter-spacing: -.02em; font-variant-numeric: tabular-nums } .xclock.urgent strong { color: var(--e-accent) }
.xeha { display: flex; align-items: center; gap: 10px }
.xhs { min-height: 32px; padding: 0 14px; border-radius: 9px; border: 1px solid #19231d24; background: var(--e-surface); font-size: 13px !important; font-weight: 700 !important; cursor: pointer } .xhs:disabled { opacity: .4 }
.xhomeb { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px 0 9px; border-radius: 9px; border: 1px solid #19231d24; background: var(--e-surface, #fff); color: inherit; font-size: 13px; font-weight: 700; cursor: pointer; flex: none }
.xhomeb svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.xbh .xhomeb { margin-left: auto }
.xupb { display: inline-flex; align-items: center; gap: 2px; min-height: 32px; padding: 0 10px 0 4px; border-radius: 9px; border: 1px solid #19231d24; background: var(--e-surface, #fff); color: inherit; font-size: 13px; font-weight: 700; cursor: pointer; flex: none }
.xupb svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round }
@media (max-width: 420px) { .xupb span { display: none } .xupb { padding: 0 6px } }
@media (max-width: 420px) { .xeh .xhomeb span { display: none } .xeh .xhomeb { padding: 0 8px } }
.xava2 { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(150deg, #cbd8bd, #849b6a); color: #fff; display: grid; place-items: center; font: 600 15px KaiTi, STKaiti, serif }
.xsn { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; height: 29px; padding: 2px; border-radius: 9px; background: #19231d0b }
.xsn button { border: 0; background: none; border-radius: 7px; font-size: 11px !important; font-weight: 600; color: var(--e-muted) !important; opacity: 1 !important }
.xsn button.current { background: #fffefad1; color: var(--e-green) !important; box-shadow: 0 1px 3px #0000001a }
.xec { position: absolute; top: 94px; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px 24px }
.xea { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; height: calc(58px + env(safe-area-inset-bottom, 0px)); padding: 7px 10px env(safe-area-inset-bottom, 0px); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; background: #f5f4eff5; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--e-line) }
.xea button { height: 44px; border: 0; border-radius: 22px; background: none; color: var(--e-green) !important; font-size: 12px !important; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 3px; cursor: pointer }
.xea button svg { width: 16px; height: 16px } .xea button:disabled { opacity: .35 }
.xea button.is-submit { background: var(--e-green); color: #fff !important; box-shadow: 0 4px 12px #24543a47 }
.xqm { position: sticky; top: 0; z-index: 5; margin: 0 -16px; padding: 10px 16px; background: var(--e-paper); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #19231d0d }
.xstp { flex: 1; display: grid; gap: 6px; min-width: 0 }
.xstc { display: flex; justify-content: space-between; font-size: 12px; color: var(--e-muted) } .xstc strong { font-family: var(--num); color: var(--e-ink) }
.xstt { height: 4px; border-radius: 9px; background: var(--e-sage); overflow: hidden } .xstt i { display: block; height: 100%; background: var(--e-green); border-radius: 9px; transition: width .3s }
.xqmark { width: 44px; height: 44px; flex: none; border: 0; background: none; display: grid; place-items: center; color: #b7bdb8; cursor: pointer }
.xqmark svg { width: 24px !important; height: 24px !important } .xqmark.active { color: #d49322 } .xqmark.active svg { fill: currentColor }
.xmp { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0 }
.xra { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 0; background: var(--e-green); color: #fff !important; display: grid; place-items: center; cursor: pointer; box-shadow: 0 3px 10px #24543a40 }
.xra svg { width: 15px; height: 15px; fill: currentColor; stroke: none } .xra:disabled { background: #b7bdb8; box-shadow: none }
.xmc { flex: 1; display: grid; gap: 6px; min-width: 0 } .xmh { display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
.xmh strong { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis } .xmh small { font: 11px var(--num); color: var(--e-muted); white-space: nowrap }
.xat { height: 2px; background: var(--e-line); border-radius: 2px; overflow: hidden } .xat span { display: block; height: 100%; background: var(--e-green) }
.xup { color: var(--e-green); font: 700 11px system-ui; cursor: pointer; text-decoration: underline }
.xbreak { display: grid; gap: 12px; padding: 30px 6px; text-align: center }
.xbreak h2 { margin: 0; font: 700 34px KaiTi, STKaiti, serif; color: var(--e-green-deep) } .xbreak p { margin: 0; color: var(--e-muted); font-size: 14px }
.xbreak ul { margin: 4px auto 10px; padding: 12px 16px; list-style: none; text-align: left; background: var(--e-surface); border: 1px solid var(--e-line); border-radius: 14px; display: grid; gap: 6px; font-size: 13.5px; width: 100% }
/* question markup, after the paper's own .paper-question layout */
.pq { display: grid; gap: 14px; padding-top: 12px }
.pq-type { font-size: 12px; font-weight: 700; color: var(--e-muted); line-height: 1.5 }
.pq-content { background: var(--e-surface); border: 1px solid var(--e-line); border-radius: 14px; padding: 14px 16px }
.pq-title { margin-bottom: 8px } .pq-title span { display: inline-block; padding: 2px 10px; border-radius: 6px; background: var(--e-sage); color: var(--e-green); font: 700 12px var(--num) }
.pq-text { font-size: 17px; line-height: 1.95 } .pq-text p { margin: 0 0 .5em; text-indent: 2em } .pq-text p:last-child { margin: 0 }
.pq-blank { display: inline-block; min-width: 2.6em; padding: 0 5px; margin: 0 2px; border-bottom: 2px solid var(--e-green); color: var(--e-green); font: 600 14px var(--num); text-align: center; text-indent: 0; line-height: 1.5 }
.pq-blank.on { font: 600 16px inherit; font-family: inherit } .pq-blank.long { min-width: 6em } .pq-fixed { color: var(--e-muted); border-bottom: 1px dashed var(--e-muted) }
.pq-sopts { background: var(--e-surface); border: 1px solid var(--e-line); border-radius: 14px; padding: 8px 16px; font-size: 16px; line-height: 1.7 }
.pq-sopts p { margin: 6px 0; display: grid; grid-template-columns: 22px 1fr } .pq-sopts b { color: var(--e-green); font-family: var(--num) }
.pq-item { display: grid; gap: 8px }
.pq-stem { width: 100%; border-collapse: collapse } .pq-stem th.qsn { width: 1%; padding: 0 10px 0 0; vertical-align: top; font: 700 16px var(--num); color: var(--e-green); white-space: nowrap } .pq-stem td { font-size: 17px; font-weight: 600; line-height: 1.7 }
.pq-opts { display: grid; gap: 8px } .pq-opts.row { grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)) }
.pq-opt { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 10px 14px; text-align: left; border-radius: 12px; border: 1px solid var(--e-line); background: var(--e-surface); cursor: pointer; font-size: 16.5px; line-height: 1.5; transition: border-color .15s, background .15s }
.pq-opt > b { font: 700 15px var(--num); color: var(--e-muted); flex: none }
.pq-opt.on { border-color: #4a75268c; background: #f1f6ec } .pq-opt.on > b { color: var(--bamboo) }
.xrd { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 1.5px solid #aeb8a4; background: #fff; display: grid; place-items: center }
.xrd.checked { border-color: var(--bamboo) } .xrd.checked::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--bamboo) }
.pq-none { margin: 0; font-size: 12.5px; color: var(--e-muted); background: var(--e-sage); border-radius: 10px; padding: 8px 12px; line-height: 1.55 }
.pq-write { width: 100%; min-height: 46vh; border-radius: 14px; border: 1px solid var(--e-line); background: var(--e-surface); padding: 14px; font-size: 17px; line-height: 1.9; outline: none; resize: vertical }
.pq-write:focus { border-color: var(--e-green) } .pq-wc { margin: -6px 0 0; text-align: right; font-size: 12px; color: var(--e-muted) } .pq-wc b { font-family: var(--num); color: var(--e-ink) }
/* result */
.xres-s { background: radial-gradient(circle at 50% 22%, #fff, #f4efdd 65%) }
.xres { display: flex; flex-direction: column; gap: 14px; align-items: stretch; text-align: center }
.xseal { width: 90px; height: 90px; margin: 10px auto 4px; border-radius: 50%; border: 3px solid var(--bamboo); display: grid; place-items: center; color: var(--bamboo); box-shadow: 0 0 0 8px #4a752614 }
.xseal svg { width: 52px !important; height: 52px !important; stroke-width: 3.5 !important }
.xscore { display: grid; gap: 4px; padding: 18px; border-radius: 14px; background: #ffffffd9; border: 1px solid #d4dcc9; text-align: left }
.xscore > span { font-size: 13px; color: var(--muted); text-align: center } .xscore > p { margin: 8px 0 0; font-size: 12px; color: var(--muted); text-align: center }
.xscore > strong { font: 800 clamp(42px, 12vw, 52px) var(--num); color: var(--vermilion-dark); text-align: center; line-height: 1.1 } .xscore > strong small { font-size: 16px; color: var(--muted) }
.xss { display: grid; margin-top: 8px } .xss div { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px }
.xss div.sub { padding-left: 14px; font-size: 13px; color: var(--muted) } .xss b { font-family: var(--num) }
.xrq { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px }
.xrq button { display: grid; padding: 6px 0; border-radius: 10px; border: 1px solid var(--e-line); background: #fff; font: 700 14px var(--num); cursor: pointer }
.xrq button small { font-size: 10px; font-weight: 500 } .xrq .correct { background: #4a752621; border-color: #4a752666; color: var(--bamboo-dark) } .xrq .wrong { background: #d769361a; border-color: #d7693666; color: var(--vermilion-dark) }
.xwr { display: grid; gap: 8px; text-align: left; padding: 16px; border-radius: 14px; background: #ffffffd9; border: 1px solid #d4dcc9 }
.xwp { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6 }
.xessay { white-space: pre-wrap; font-size: 15.5px; line-height: 1.8; padding: 10px 12px; border-radius: 10px; background: var(--e-paper); max-height: 260px; overflow: auto }
.xwc2 { margin: 0; font-size: 12.5px; color: var(--muted) }
.xgb { display: grid; gap: 6px; padding: 12px; border-radius: 12px; background: var(--bamboo-soft) } .xgb > b { font: 800 20px var(--num); color: var(--bamboo-dark) } .xgb p { margin: 0; font-size: 14px; line-height: 1.6 }
.xfix s { color: var(--vermilion-dark) } .xmodel { color: var(--muted) }
/* sub-part strip under the clock (phone) and the side bar (computer) */
.xsn { overflow-x: auto; scrollbar-width: none } .xsn::-webkit-scrollbar { display: none }
.xsn button { min-width: 64px; cursor: pointer; font-family: var(--num) !important; white-space: nowrap }
.xeh-paper { display: none; font-size: 13px; color: var(--e-muted); font-weight: 600 }
.xbreak-tip { font-size: 12.5px !important; background: var(--e-sage); border-radius: 10px; padding: 8px 12px }
.xside { display: none }
.xsd { display: grid; gap: 6px; padding: 14px 0; border-bottom: 1px solid var(--e-line) } .xsd:last-child { border: 0 }
.xsd h4 { margin: 0 0 2px; display: flex; justify-content: space-between; align-items: baseline; font: 700 18px KaiTi, STKaiti, serif; color: var(--e-green-deep) }
.xsd h4 small { font: 600 11px system-ui, sans-serif; color: var(--e-muted) }
.xsd.locked h4, .xsd.done h4 { color: var(--e-muted) } .xsd.done h4 span::after { content: ' ✓'; color: var(--bamboo) } .xsd.locked h4 span::after { content: ' 🔒'; font-size: 12px }
.xsp { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--e-line); background: var(--e-surface); cursor: pointer; text-align: left; transition: border-color .15s, background .15s }
.xsp span { display: grid; line-height: 1.25 } .xsp span b { font-size: 13.5px } .xsp span small { font: 600 12px var(--num); color: var(--e-muted) }
.xsp em { font: 700 12px var(--num); font-style: normal; color: var(--e-muted) }
.xsp i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--bamboo); border-radius: 0 3px 3px 0 }
.xsp:hover:not(:disabled) { border-color: #4a75268c }
.xsp.on { border-color: var(--e-green); background: #eef4ea; box-shadow: inset 3px 0 0 var(--e-green) } .xsp.on span b { color: var(--e-green) }
.xsp:disabled { cursor: default; opacity: .55; background: transparent }
.pq-split { display: grid; gap: 14px }
.pq-r { display: grid; gap: 14px; align-content: start }
/* computer layout: any screen wider than it is tall (or 720px+), including the narrower artifact panel */
@media (min-width: 720px), (orientation: landscape) and (min-width: 560px) {
  #xov { --sw: clamp(200px, 22vw, 280px) }
  .xf { width: 100%; box-shadow: none }
  /* pre-exam pages: landscape, two columns of cards */
  .xs { max-width: 1080px; margin: 0 auto; width: 100%; padding: 22px clamp(20px, 4vw, 48px) 24px }
  .xsb { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; align-content: start }
  .xsb > .xkick, .xsb > .xtitle, .xsb > .xlead, .xsb > .xnote, .xsb > .xsec, .xsb > .xil, .xsb > .xentry, .xsb > .xres, .xsb > #xLayer { grid-column: 1 / -1 }
  .xsb > .xtitle { font-size: var(--fs-2xl) }
  .xentry { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; padding-top: 2vh }
  .xentry > .xkick, .xentry > .xtitle, .xentry > .xlead, .xentry > .xfoot { grid-column: 1 / -1 }
  .xlang { padding: 26px 24px } .xlang b { font-size: var(--fs-lg) }
  .xil { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px } .xil li:nth-last-child(2) { border: 0 }
  .xpa { flex-direction: row; justify-content: flex-end; border-top: 1px solid #527d2a29; padding-top: 16px } .xpa .xb { min-width: 180px; flex: none !important }
  .xvc { margin-right: auto }
  .xres { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px 24px; text-align: left; align-items: start }
  .xres > .xseal, .xres > .xtitle, .xres > .xlead { grid-column: 1 / -1; text-align: center }
  .xres > .xwr { grid-column: 1 / -1 }
  /* exam screen */
  .xf.wide { background: var(--e-paper) }
  .xeh { padding: 10px 24px 0; height: 64px } .xec { top: 64px !important }
  .xeh-paper { display: inline }
  .xeh .xsn { display: none }
  .xside { display: block; position: absolute; top: 64px; bottom: 58px; left: 0; width: var(--sw); overflow-y: auto; padding: 8px 16px 18px; background: #efeee7; border-right: 1px solid var(--e-line); z-index: 6 }
  .xside-h { display: grid; gap: 2px; padding: 10px 0 12px; border-bottom: 1px solid var(--e-line) } .xside-h b { font-size: 14px } .xside-h small { font-size: 12px; color: var(--e-muted) }
  .xec { left: var(--sw); padding: 0 max(24px, calc((100% - 1120px) / 2)) 32px }
  .xqm { margin: 0; padding: 12px 0 }
  .pq-opts:not(.row) { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .pq-write { min-height: 52vh }
  .xea { left: var(--sw); grid-template-columns: repeat(3, minmax(0, 160px)); justify-content: center; gap: 16px }
  .xea button { font-size: 13.5px !important }
  .xsheet-l { align-items: center; justify-content: center } .xsheet { max-width: 680px; border-radius: 24px; animation: xfade .2s } .xhandle { display: none }
  .xag { grid-template-columns: repeat(10, 1fr) }
  .xrq { grid-template-columns: repeat(10, 1fr) }
  .xbreak { max-width: 620px; margin: 0 auto }
}
/* reading: passage on top, each question with its options underneath; options two per row on a wide screen */
@media (min-width: 720px), (orientation: landscape) and (min-width: 560px) {
  .pq-split { max-width: 960px }
}
@media (max-width: 560px) { .xscores { grid-template-columns: minmax(0, 1fr) } .xseg { grid-template-columns: minmax(0, 1fr) } }
/* AI memory trainer */
.mactions.four { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)) }
.aiday { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0 0 8px }
.aislot { display: grid; gap: 2px; text-align: left; padding: 12px 14px; border: 1.5px solid var(--rule); border-radius: 12px; background: var(--sheet) }
.aislot .ic { font-size: 22px } .aislot b { font-size: 15px } .aislot span { font-size: 13px } .aislot small { color: var(--muted); font-size: 12px }
.aislot i { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; margin-top: 6px } .aislot i u { display: block; height: 100%; background: var(--ok) }
.aislot em { font-style: normal; font-size: 12.5px; color: var(--muted) }
.aislot.now { border-color: var(--pen); box-shadow: 0 0 0 3px var(--pen-soft) }
.aislot.done { border-color: var(--ok) } .aislot.done em { color: var(--ok); font-weight: 600 }
.aislot:hover { border-color: var(--ink) }
@media (max-width: 860px) { .aiday { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.aiopts { display: grid; gap: 8px; width: 100%; max-width: 620px }
.aiopt { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: center; text-align: left; padding: 12px 14px; border: 1.5px solid var(--rule); border-radius: 12px; background: var(--sheet); font-size: 15.5px }
.aiopt b { font: 600 11px var(--f-ui); color: var(--muted) }
.aiopt .zh.big { font-family: var(--f-zh); font-size: 26px }
.aiopt:hover:not(:disabled) { border-color: var(--ink) }
.aiopt:disabled { cursor: default; color: inherit }
.aiopt.good { border-color: var(--ok); background: var(--ok-soft) }
.aiopt.bad { border-color: var(--pen); background: var(--pen-soft) }
.aireveal { display: grid; gap: 4px; padding: 10px 14px; border-radius: 10px; background: var(--chip); margin: 8px 0; text-align: left }
.aireveal .zh { font-family: var(--f-zh); font-size: 20px }
.aireveal p.zh { font-size: 17px; margin: 4px 0 0 }
.aireveal small { color: var(--muted) }
.aireveal .btn { padding: 2px 8px; font-size: 13px }
.zhx { font-family: var(--f-zh); color: var(--ok) }
.py { color: var(--pen); font-family: var(--f-ui) }
.aisum { width: 100%; max-width: 560px; font: 16px var(--f-ui); padding: 10px 12px; border: 1.5px solid var(--rule); border-radius: 10px; background: var(--sheet); color: var(--ink) }
.aisum:focus { outline: 2px solid var(--pen); outline-offset: 1px }
.aichain { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; justify-content: center; font-size: 13.5px; color: var(--muted); max-width: 620px }
.aichain span { padding: 2px 10px; border-radius: 999px; background: var(--chip) }
.aichain i { font-style: normal }
.aiscript { margin: 8px 0; text-align: left } .aiscript summary { cursor: pointer; color: var(--muted); font-size: 13.5px }
.aiscript p { margin: 4px 0; font-size: 16px } .aiscript p.ev { background: var(--ok-soft) }
.aigrade { text-align: left; display: grid; gap: 4px; padding: 10px 14px; background: var(--chip); border-radius: 10px; margin: 8px 0 }
.aigrade p { margin: 0; font-size: 14px } .aigrade small { color: var(--muted) }
.aichainok { color: var(--ok); font-weight: 600 }
.aibars { display: grid; gap: 10px; margin: 12px 0; max-width: 680px }
.aibar { display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 4px 10px; align-items: center }
.aibar span { grid-column: 1 / -1; font-size: 14px } .aibar span b { margin-right: 6px }
.aibar i { height: 12px; border-radius: 6px; background: var(--chip); overflow: hidden }
.aibar u { display: block; height: 100%; background: var(--ok); border-radius: 6px; transition: width .6s }
.aibar.weak u { background: var(--pen) } .aibar.weak span b { color: var(--pen) }
.aibar em { font-style: normal; font-family: var(--f-pen); font-size: 24px; text-align: right }
.aibar small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; margin-top: -4px }
@media (max-width: 560px) { .mactions.four { grid-template-columns: minmax(0, 1fr) } }
/* learning loop */

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }

/* ───────────── shared question renderer ───────────── */
function markup(raw, src, it, blankFn) {
  const ranges = [];
  it.hints.forEach((h, i) => {
    if (i >= step || h.in !== src) return;
    const s = raw.indexOf(h.t);
    if (s < 0) { console.warn('hint not found', it.n, h.t); return; }
    const e = s + h.t.length;
    if (ranges.some(r => s < r.e && e > r.s)) return;
    ranges.push({ s, e, i });

  ranges.sort((a, b) => a.s - b.s);

    .replace(/\{(\d+)\}/g, (_, n) => blankFn ? blankFn(+n) : '')

  for (const r of ranges) {
    out += plain(raw.slice(pos, r.s));
    out += `<mark data-i="${r.i}" class="${r.i === step - 1 ? 'sweep' : ''}">${plain(raw.slice(r.s, r.e))}</mark>`;

}
const ring = '<svg viewBox="0 0 34 34" aria-hidden="true"><path d="M27 8c-4-4-14-5-19 0s-4 15 2 18 15 2 18-4 1-12-4-15"/></svg>';

function questionHTML(it, cfg) {

      reveal ? `<span class="blank filled">${words[n - 1]}</span>`
        : exam && chosen ? `<span class="blank picked">${it.opts[chosen][n - 1]}</span>`
        : `<span class="blank">${CIRCLED[n - 1]}</span>`)}</p></div>`;
    html += '<ol class="opts">' + Object.entries(it.opts).map(([k, ws]) =>
      optLi(k, `<span class="words">${ws.map((w, i) => `<i><b>${CIRCLED[i]}</b>${w}</i>`).join('')}</span>`)).join('') + '</ol>';
  }

    const g = paper().groups[it.p];

      if (n !== it.n) return `<span class="blank ${exam && picks[n] ? 'picked' : ''}">${n}${exam && picks[n] ? ' · ' + picks[n] : ''}</span>`;
      if (reveal) return `<span class="blank filled long">${g.opts[it.ans]}</span>`;
      if (exam && chosen) return `<span class="blank cur">（${n}）${g.opts[chosen]}</span>`;
      return `<span class="blank cur">（${n}）</span>`;
    })}</p></div>`;
    html += '<ol class="opts">' + Object.entries(g.opts).map(([k, v]) => optLi(k, `<span>${v}</span>`)).join('') + '</ol>';

}
function answerText(it) {
  if (it.type === 'fill') return it.opts[it.ans].join(' · ');

}

// Chinese: Mandarin of the mainland first, and among those the recorded-sounding neural voices; never Cantonese when Mandarin exists
function pickVoice(lang) {
  const list = voices.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(lang));
  if (lang !== 'zh') return list.find(v => /natural|online|neural/i.test(v.name)) || list[0] || null;
  const rank = v => { const l = v.lang.replace('_', '-').toLowerCase(), n = v.name;
    return (/hk|yue|cantonese/i.test(l + n) ? -100 : 0) + (l.startsWith('zh-cn') || /hans|普通话|mandarin/i.test(l + n) ? 20 : 0)
      + (/natural|neural/i.test(n) ? 10 : /online/i.test(n) ? 8 : /google/i.test(n) ? 6 : 0) + (/xiaoxiao|晓晓/i.test(n) ? 2 : /yunxi|xiaoyi|云希|晓伊/i.test(n) ? 1 : 0); };

// what the listener will get: a neural voice sounds close to a recording, a system voice sounds synthetic
function zhVoiceNote() {
  const v = pickVoice('zh');

  if (!v) return 'เครื่องนี้ยังไม่มีเสียงภาษาจีน · เปิดลิงก์นี้ใน Microsoft Edge จะได้เสียงธรรมชาติ';
  const good = /natural|neural|online|google/i.test(v.name);
  return `เสียงที่ใช้: ${v.name}${good ? '' : ' (เสียงสังเคราะห์ของเครื่อง) · เปิดลิงก์นี้ใน Microsoft Edge จะได้เสียงธรรมชาติกว่า'}`;
}
// split mixed Thai/Chinese text so each run is read by a matching voice
function segments(text) {
  const clean = text.replace(/→/g, ' ดังนั้น ').replace(/✓/g, ' ถูก ').replace(/[·•]/g, ' ').replace(/≠/g, ' ไม่เท่ากับ ').replace(/\s+/g, ' ');
  const out = [];
  clean.split(/([㐀-鿿][㐀-鿿“”‘’，。、；：？！…—（）《》\s]*)/).forEach(s => {
    if (!s || !s.trim()) return;

let speakId = 0;
function stopSpeech() { speakId++; faStop(); try { synth && synth.cancel() } catch {} }

const FA = window.FAMAUDIO || { files: [], clips: {} }, faBuf = new Map();

function faStop() {
  if (faAud) { faAud.onended = faAud.onerror = null; try { faAud.pause() } catch {} faAud = null; }

async function faPlay(text, id) {
  const c = FA.clips[text]; if (!c) return false;
  try {
    let p = faBuf.get(c[0]);
    if (!p) { p = fetch(`audio/fam/${FA.files[c[0]]}.mp3`).then(r => { if (!r.ok) throw new Error('audio'); return r.arrayBuffer(); }); faBuf.set(c[0], p); p.catch(() => faBuf.delete(c[0])); }

// Chinese-only speech whose every sentence has a clip is played from the clips; anything else goes to the system voice
function clipSegs(parts) {
  const out = [];
  for (const p of parts) {
    if (p.lang !== 'zh' || p.on) return null;
    if (FA.clips[p.text]) { out.push(p.text); continue; }
    const bits = p.text.split('。').filter(Boolean);
    if (!bits.length || !bits.every(t => FA.clips[t])) return null;

  const id = speakId;
  return (async () => {
    for (let i = 0; i < segs.length; i++) {
      if (id !== speakId) return;
      if (!(await faPlay(segs[i], id)) && id === speakId) return speakTTS([{ text: segs.slice(i).join('。'), lang: 'zh' }]);

  if (!k) return;

  const w = document.querySelector(`#notes .whys li[data-k="${k}"]`);
  o?.classList.add('speaking'); w?.classList.add('speaking');
  if (o) { const r = o.getBoundingClientRect(); if (r.top < 60 || r.bottom > window.innerHeight - 140) o.scrollIntoView({ block: 'center', behavior: 'smooth' }); }

// hand-drawn pen marks under/around each highlighted phrase
function drawInk(animate, all = false) {
  const c = $('content');
  c.querySelector('.ink')?.remove();
  const marks = [...c.querySelectorAll('mark')];
  if (!marks.length) return;
  const box = c.getBoundingClientRect();
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class', 'ink');
  svg.setAttribute('width', box.width); svg.setAttribute('height', box.height);
  const cur = String(step - 1);
  let scrolled = false;
  marks.forEach(m => {
    const isCur = all || m.dataset.i === cur;
    if (isCur && voiceOn && !all) m.classList.add('speaking');
    const anim = isCur && animate;
    const rects = [...m.getClientRects()].filter(r => r.width > 2);
    if (!rects.length) return;
    const seed = +m.dataset.i + 1;
    if (rects.length === 1 && rects[0].width < 150) {
      const r = rects[0], x = r.left - box.left, y = r.top - box.top, w = r.width, hgt = r.height;
      const cx = x + w / 2, cy = y + hgt / 2 + 1, rx = w / 2 + 9, ry = hgt / 2 + 3;
      const d = `M${cx + rx * .7} ${cy - ry * .95} C${cx + rx * 1.1} ${cy - ry * .2}, ${cx + rx} ${cy + ry}, ${cx} ${cy + ry} S${cx - rx} ${cy + ry * .4}, ${cx - rx} ${cy - ry * .1} S${cx - rx * .3} ${cy - ry * 1.05}, ${cx + rx * .3} ${cy - ry} S${cx + rx * 1.05} ${cy - ry * .5}, ${cx + rx * .85} ${cy - ry * .15}`;
      addPath(svg, d, anim, 2.4 * (rx + ry) * 1.7);
    } else {
      rects.forEach(r => {
        const x1 = r.left - box.left, x2 = r.right - box.left, y = r.bottom - box.top - 3;
        const wob = (seed % 2 ? 1.6 : -1.6);
        addPath(svg, `M${x1} ${y + 1} Q${(x1 + x2) / 2} ${y + 3 + wob} ${x2} ${y}`, anim, x2 - x1 + 20);
      });
    }
    const r0 = rects[0];
    const g = document.createElementNS(ns, 'g');
    g.setAttribute('class', 'badge' + (anim ? ' pop' : ''));
    const bx = r0.left - box.left - 4, by = r0.top - box.top + 1;
    g.innerHTML = `<circle cx="${bx}" cy="${by}" r="9"/><text x="${bx}" y="${by + .5}">${seed}</text>`;
    svg.appendChild(g);
    if (anim && !scrolled && (r0.top < 70 || r0.bottom > window.innerHeight - 200)) { scrolled = true; m.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  });
  c.appendChild(svg);
  if (!all && step > hintCount(item()) && animate) c.querySelector('.correct')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function addPath(svg, d, anim, len) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');

function goStep(s) {

function goQ(i) {

    const t0 = Date.now();

    await nextAction();

    // without voice: fixed reading time; with voice: wait for speech, then a short pause
    const min = step === 0 ? 900 : wasReveal ? 900 : step > H ? 4200 : 3400;
    const spent = Date.now() - t0;

function startExam(strategic, withWrite) {

function tickPanel() {

    const n = ex.order[ex.pos], it = byN(n), bud = BUDGET[it.type], sp = ex.spent[n] || 0;
    const planned = ex.order.slice(0, ex.pos).reduce((s, m) => s + BUDGET[byN(m).type], 0);
    const diff = ex.used - planned - Math.min(sp, bud);
    const clock = $('clock'); if (!clock) return;
    clock.textContent = fmt(left); clock.classList.toggle('low', left < 300);
    $('miniclock').textContent = fmt(left); $('miniclock').classList.toggle('low', left < 300);
    const pace = $('pace');
    if (Math.abs(diff) < 30) { pace.textContent = 'ตรงตามแผน'; pace.className = 'pace ok'; }
    else if (diff > 0) { pace.textContent = `ช้ากว่าแผน ${fmt(diff)}`; pace.className = 'pace slow'; }

// —— scanning: question first, auto-extracted keywords, tap the evidence sentence ——
const SCAN_STOP = ['根据上文', '下列哪项', '哪项', '正确', '关于', '可以知道', '最适合做', '最适合', '标题', '主要谈的是', '主要', '画线词语', '画线句子', '最可能是', '什么意思', '意思', '为什么', '是什么', '什么', '怎么', '怎样', '哪种', '有什么', '作者认为', '作者', '指的是', '是想说明', '说明', '告诉我们', '上文'];
function stemKeys(q, text) {
  let s = q.replace(/第\s*\d+\s*段中?/g, ' ').replace(/[“”"《》：:，,？?。、（）()\s]/g, ' ');
  SCAN_STOP.forEach(w => { s = s.split(w).join(' '); });
  const keys = []; let i = 0;
  while (i < s.length) {
    if (s[i] === ' ') { i++; continue; }
    let got = 0;
    for (let L = Math.min(10, s.length - i); L >= 2; L--) {
      const sub = s.substr(i, L);
      if (!sub.includes(' ') && text.includes(sub)) { got = L; break; }
    }
    if (got) { keys.push(s.substr(i, got)); i += got; } else i++;

    const arr = [], re = /[^。！？]+[。！？]*[”’」]?/g; let m;
    while ((m = re.exec(p))) if (m[0].trim()) arr.push({ i: idx++, s: off + m.index, e: off + m.index + m[0].length, text: m[0] });
    paras.push(arr); off += p.length + 1;
  });
  return paras;
}

  if (!hs.length) hs = it.hints.filter(h => h.in === 'p');

}

function startScan() {

    Object.entries(groups).forEach(([p, items]) => {

// ★ more than half right before the first miss (unlocks the next level)
// ★★ every question right   ★★★ every question right and each one faster than the gold line
const LV = {
  c: { name: 'คู่คำอัตโนมัติ · 搭配', unit: 'คู่คำ', size: 10, hard: 8000, gold: 3000 },
  s: { name: 'สแกนหาคำตอบ · 81–100', unit: 'คำถาม', size: 6, hard: 43000, gold: 25000 },
  u: { name: 'ใช้คำในบริบท', unit: 'กลุ่มคำ', size: 3, hard: 15000, gold: 6000 }

let levelCache = null, lv = null, lvTimer = null, lvT = null;
function stopLv() { clearInterval(lvTimer); lvTimer = null; clearTimeout(lvT); lvT = null; closePop(); }
function chunk(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  if (out.length > 1 && out[out.length - 1].length < size / 2) out[out.length - 2].push(...out.pop());
  return out;
}
// harder when the distractors share characters with the answer, the answer is a 4-character idiom, or the context is short
function collocDiff(c) {
  const shared = c.choices.filter(w => w !== c.ans && [...w].some(ch => c.ans.includes(ch))).length;
  const ctx = (c.left + c.right).replace(/＿/g, '').length;
  return shared * 2 + (c.ans.length >= 4 ? 2 : 0) + (c.choices.some(w => w.length >= 4) ? 1 : 0) + (ctx < 6 ? 1 : 0);
}
function scanQuestions(ids) {
  const seen = new Set(), out = [];
  ids.forEach(pid => PAPERS[pid].items.filter(it => it.type === 'read').forEach(it => {
    const text = PAPERS[pid].groups[it.p].text, sig = text.slice(0, 40) + it.n;
    if (seen.has(sig)) return; seen.add(sig);
    out.push({ key: pid + ':' + it.n, pid, it, text });
  }));
  return out;
}
// harder when the stem has no keywords (哪项正确 / title), asks a word meaning, has several evidence spots, traps, or a long passage
function scanDiff(q) {
  const keys = stemKeys(q.it.q, q.text);
  const traps = q.it.hints.filter(h => h.note.startsWith('กับดัก')).length;
  return (keys.length ? 0 : 3) + (/意思|画线/.test(q.it.q) ? 1 : 0) + (evidenceOf(q.it, q.text).length > 1 ? 1 : 0) + traps + q.text.length / 500;
}
// "Use in context": one option word, several short sentences; pick every sentence the word fits.
// Fitting sentences = the exam passage around the blank + the word's vocab sentences (it may appear in several groups).
// Non-fitting sentences = sentences written for its sibling options, i.e. the near-synonyms the exam uses as traps.
function usageItems(ids) {
  const W = new Map(), get = w => W.get(w) || W.set(w, { w, ok: [], sibs: [], mean: '' }).get(w);
  ids.forEach(pid => {
    const T = ((window.TH || {})[pid] || { i: {} }).i;
    PAPERS[pid].items.filter(it => it.type === 'fill').forEach(it => {
      const keys = Object.keys(it.opts);
      for (let b = 0; b < it.opts[keys[0]].length; b++) {
        const words = keys.map(k => it.opts[k][b]), rows = ((window.VOC || {})[pid] || {})[it.n + '.' + b] || [];
        words.forEach((w, i) => {
          const e = get(w);
          words.forEach(x => { if (x !== w && !e.sibs.includes(x)) e.sibs.push(x); });
          const [zh, th, mean] = (rows[i] || '').split('|');
          if (zh && !e.ok.some(o => o.zh === zh)) e.ok.push({ zh, th });
          if (!e.mean) e.mean = mean || ((T[it.n] || {})[keys[i]] || '').split('·')[b]?.trim() || '';
        });
        const ans = it.opts[it.ans][b], c = collocContext(it.text, b + 1), zh = (c.left + ans + c.right).trim(), e = get(ans);
        if (!e.ok.some(o => o.zh === zh)) e.ok.unshift({ zh, th: 'บริบทจากข้อสอบ ' + paperName(pid) + ' ข้อ ' + it.n, exam: true });
      }
    });
  });
  // extra everyday contexts written per word (data/ctx*.js)
  W.forEach(e => ((window.CTX || {})[e.w] || []).forEach(r => {
    const [zh, th] = r.split('|');
    if (!e.ok.some(o => o.zh === zh)) e.ok.push({ zh, th });
  }));
  const out = [];
  W.forEach(e => {
    if (e.ok.length < 2) return;
    const wrong = [];
    e.sibs.forEach(s => {
      const o = (W.get(s) || { ok: [] }).ok.find(o => !o.exam && !o.zh.includes(e.w));
      if (o && wrong.length < 3) wrong.push({ ...o, w: s });
    });
    if (wrong.length < 2) return;
    const shared = wrong.filter(o => [...o.w].some(ch => e.w.includes(ch))).length;
    out.push({ key: e.w, w: e.w, mean: e.mean, ans: '✓',
      okPool: e.ok.map(o => ({ ...o, w: e.w, ok: true })), wrong: wrong.map(o => ({ ...o, ok: false })), sibs: e.sibs,
      diff: shared * 2 + (e.w.length >= 4 ? 2 : 0) + wrong.length + Math.min(3, e.ok.length) / 2 });
  });
  return out;
}

// "Sort the sentences": one blank's options become fixed bins; their sentences arrive one at a time and each goes
// to the word that fits best. Always comparing words means there is always a best answer, so nothing rests on a guess.
function usageGroups(ids) {
  const byW = new Map(usageItems(ids).map(x => [x.w, x])), seen = new Set(), out = [];
  ids.forEach(pid => PAPERS[pid].items.filter(it => it.type === 'fill').forEach(it => {
    const keys = Object.keys(it.opts);
    for (let b = 0; b < it.opts[keys[0]].length; b++) {
      const ws = [...new Set(keys.map(k => it.opts[k][b]))].filter(w => byW.has(w)), sig = [...ws].sort().join(',');
      if (ws.length < 3 || seen.has(sig)) continue;
      seen.add(sig);
      // a sentence that already contains another bin word would give the answer away
      const words = ws.map(w => ({ w, mean: byW.get(w).mean, pool: byW.get(w).okPool.filter(o => !ws.some(v => v !== w && o.zh.includes(v))) }));
      if (words.some(x => !x.pool.length)) continue;
      const shared = ws.reduce((n, w, i) => n + ws.slice(i + 1).filter(v => [...v].some(ch => w.includes(ch))).length, 0);
      out.push({ key: sig, words, diff: shared * 2 + (ws.some(w => w.length >= 4) ? 2 : 0) + ws.length / 2 });
    }
  }));
  return out;
}

function usageTasks(set) {
  const flags = new Set(store.get('hsk.u.flag', []));
  return set.flatMap(g => {
    const bins = shuffle(g.words);
    return shuffle(bins.flatMap(x => shuffle(x.pool.filter(o => !flags.has(o.zh))).slice(0, 2).map(o => ({ bins, o, ans: x.w }))));
  });
}

}

function aiSentStep(x) {

  if (!o) return aiMeanStep(x, 8000);
  const others = shuffle([...x.wrong, ...shuffle(B.words).slice(0, 6).flatMap(y => y.okPool.filter(c => !c.exam && c.th).slice(0, 1))]).filter(c => c.th && c.th !== o.th).slice(0, 3);
