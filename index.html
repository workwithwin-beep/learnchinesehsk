function aiConnSteps(count, n, rate, summaries) {
  const out = [], seen = new Set();
  const qs = shuffle(LIST.filter(id => PAPERS[id]).flatMap(pid => PAPERS[pid].items.filter(it => it.type === 'read' && !/不正确|不包括|标题|题目|主要|错误|不符|不是|告诉我们/.test(it.q)).map(it => ({ pid, it, text: PAPERS[pid].groups[it.p].text }))));
  for (const q of qs) {
    if (out.length >= count) break;
    const flat = sentencesOf(q.text).flat(), ev = evidenceOf(q.it, q.text), ei = flat.findIndex(s => ev.some(r => s.s < r.e && s.e > r.s));
    if (ei < 0 || seen.has(q.text)) continue;
    const start = Math.max(0, Math.min(ei - 1, flat.length - n)), win = flat.slice(start, start + n);

  }
  return out;
}

    P.items.filter(it => it.type === 'fill').forEach(it => texts.add(it.text.replace(/\{\d+\}/g, '＿')));
  });
  memBank().words.forEach(x => x.okPool.filter(o => !o.exam).forEach(o => texts.add(o.zh)));
  const sents = [...new Set([...texts].flatMap(t => t.split(/(?<=[。！？])/)).map(s => s.trim()))].filter(s => s.length >= 8 && s.length <= 80 && !s.includes('＿') && !/[“”"]/.test(s));

function memKey(e) {
  const k = e.key;
  if ($('lvModal')) { if (k === 'Enter') { e.preventDefault(); $('lvModal').querySelector('button')?.click(); } return; }
  if (ai) {
    if (e.target.closest('input')) { if (k === 'Enter') { e.preventDefault(); $('aiGo') && !$('aiGo').disabled && $('aiGo').click(); } return; }
    if (k === 'Enter') { const b = $('aiNextB') || ($('aiGo') && !$('aiGo').disabled && $('aiGo')); if (b) { e.preventDefault(); b.click(); } }
    else if (/^[1-4]$/.test(k)) $('notes').querySelectorAll('.aiopt:not(:disabled)')[+k - 1]?.click();
    return;
  }
  if (!mem) return;
  if (mem.kind === 'recall') {
    if (mem.answered) { if (k === 'Enter' || k === ' ') { e.preventDefault(); memRecallShow(); } }
    else if (k === 'Backspace') { e.preventDefault(); memUndo(); }
  } else if (mem.kind === 'learn' && (k === 'Enter' || k === 'ArrowRight')) { e.preventDefault(); $('mNext')?.click(); }
  else if (mem.kind === 'boss' && /^[1-4]$/.test(k)) $('notes').querySelectorAll('[data-v]')[+k - 1]?.click();
}

    return { type: 'listen', part: LP.find(p => num <= p[1])[2], qs: [{ num, opts: Object.fromEntries('ABCD'.split('').map((k, i) => [k, d ? d[0][i] : ''])), ans: d ? d[1] : undefined }] };
  }) };
  const scr = [];
  if (ver === '2.0') {
    by('error').forEach(it => scr.push({ type: 'choice', part: '第一部分 · 第51–60题 请选出有语病的一项', qs: [{ num: it.n, opts: it.opts, ans: it.ans, src: it.n }] }));
    by('fill').forEach(it => scr.push({ type: 'fill2', part: '第二部分 · 第61–70题 选词填空', text: it.text,
      qs: [{ num: it.n, opts: Object.fromEntries(Object.entries(it.opts).map(([k, ws]) => [k, ws.join(' / ')])), ans: it.ans, src: it.n }] }));
  } else {
    let num = 41;
    for (const it of by('fill')) {
      if (num > 50) break;
      const keys = Object.keys(it.opts), qs = [], fixed = {};
      for (let b = 0; b < it.opts[keys[0]].length; b++) {
        const right = it.opts[it.ans][b];
        if (num > 50) { fixed[b + 1] = right; continue; }
        const words = [...new Set(keys.map(k => it.opts[k][b]))];
        qs.push({ num: num++, blank: b + 1, opts: Object.fromEntries(words.map((w, i) => ['ABCD'[i], w])), ans: 'ABCD'[words.indexOf(right)], src: it.n });
      }
      scr.push({ type: 'cloze', part: '第一部分 · 第41–50题 选词填空', text: it.text, qs, fixed });
    }
  }
  // sentence gaps; in 3.0 one decoy sentence from another paper joins the five options
  groupsOf('sent').forEach(({ p, g, items }) => {
    let opts = Object.values(g.opts), letter = Object.fromEntries(Object.keys(g.opts).map((k, i) => [k, i]));
    if (ver === '3.0') {
      const pool = LIST.filter(id => PAPERS[id] && id !== pid).flatMap(id => Object.values(PAPERS[id].groups).filter(x2 => x2.opts && typeof Object.values(x2.opts)[0] === 'string').flatMap(x2 => Object.values(x2.opts)));
      const decoy = pool[hashStr(pid + p) % pool.length];
      const order = seeded([...opts.keys(), -1], hashStr(p + pid));
      const all = [...opts, decoy];
      letter = Object.fromEntries(Object.keys(g.opts).map((k, i) => [k, order.indexOf(i)]));
      opts = order.map(i => i < 0 ? decoy : all[i]);
    }
    const L = 'ABCDEF', o = Object.fromEntries(opts.map((s, i) => [L[i], s]));
    scr.push({ type: 'sent', part: ver === '3.0' ? '第二部分 · 第51–60题 选句填空（其中一句为干扰项）' : '第三部分 · 第71–80题 选句填空', text: g.text, shift, opts: o,
      qs: items.map(it => ({ num: it.n - shift, opts: Object.fromEntries(Object.keys(o).map(k => [k, ''])), ans: L[letter[it.ans]], src: it.n })) });
  });
  groupsOf('read').forEach(({ g, items }) => scr.push({ type: 'read', part: ver === '3.0' ? '第三部分 · 第61–80题 请选出正确答案' : '第四部分 · 第81–100题 请选出正确答案', text: g.text,
    qs: items.map(it => ({ num: it.n - shift, q: it.q, opts: it.opts, ans: it.ans, src: it.n })) }));
  const read = { key: 'read', name: '阅读', min: V.time.read, screens: scr };
  let write;
  if (ver === '2.0') {
    const w = by('write')[0];
    write = { key: 'write', name: '书写', min: V.time.write, screens: [{ type: 'write2', part: '第101题 缩写', text: w ? P.groups[w.p].text : '', qs: [{ num: 101, min: 350, kind: '缩写', prompt: '请将这篇文章缩写成一篇短文，标题自拟，字数400左右。' }] }] };
  } else {
    const [a, b] = W3[pid] || W3.H61001;
    write = { key: 'write', name: '写作', min: V.time.write, screens: [
      { type: 'write', part: '第81–82题 应用文写作、话题作文', qs: [{ num: 81, min: 150, kind: '应用文写作', prompt: a }] },
      { type: 'write', part: '第81–82题 应用文写作、话题作文', qs: [{ num: 82, min: 300, kind: '话题作文', prompt: b }] }] };
  }
  return { pid, ver, sections: [listen, read, write] };
}

function xdb() { return new Promise((res, rej) => { const r = indexedDB.open('hsk-audio', 1); r.onupgradeneeded = () => r.result.createObjectStore('a'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function audioOp(mode, key, val) {
  try {
    const d = await xdb();
    return await new Promise((res, rej) => {
      const t = d.transaction('a', mode === 'get' ? 'readonly' : 'readwrite'), s = t.objectStore('a');
      const r = mode === 'get' ? s.get(key) : mode === 'put' ? s.put(val, key) : s.delete(key);
      r.onsuccess = () => res(r.result === undefined && mode !== 'get' ? true : r.result); r.onerror = () => rej(r.error);
    });
  } catch { return null; }
}

// sub-parts: 3 sections split into the paper's own parts; any sub-part of the running section can be opened in any order
const X_SUBS = {
  '2.0': { listen: [[1, 15], [16, 30], [31, 40], [41, 50]], read: [[51, 60], [61, 70], [71, 80], [81, 100]], write: [[101, 101]] },
  '3.0': { listen: [[1, 15], [16, 30], [31, 40]], read: [[41, 50], [51, 60], [61, 80]], write: [[81, 82]] }
};
const CN_N = '一二三四五';
function xSubs(si) {
  const sec = x.exam.sections[si];
  return (x.exam.subs || X_SUBS[x.ver])[sec.key].map(([lo, hi], i) => {
    const pis = sec.screens.map((s, pi) => [s, pi]).filter(([s]) => s.qs[0].num >= lo && s.qs[0].num <= hi).map(([, pi]) => pi);
    const qs = pis.flatMap(pi => sec.screens[pi].qs);
    // the paper's listening part 3 (31–50) is split in two here, so it keeps its own name with (一)/(二)
    const label = sec.key === 'write' ? (lo === hi ? `第${lo}题` : `第${lo}–${hi}题`)
      : sec.key === 'listen' && i >= 2 && x.ver === '2.0' && !x.exam.subs ? `第三部分（${CN_N[i - 2]}）` : `第${CN_N[i]}部分`;
    return { lo, hi, i, pis, qs, label, range: lo === hi ? `${lo}` : `${lo}–${hi}` };
  }).filter(s => s.pis.length);
}
function xSide() {

      const st = si < x.si ? 'done' : si > x.si ? 'locked' : 'cur';
      return `<div class="xsd ${st}"><h4><span>${s.name}</span><small>${st === 'done' ? '已交卷' : st === 'locked' ? '未开始' : s.min + ' 分钟'}</small></h4>

const xRangeOf = qs => qs.length > 1 ? `${qs[0].num}-${qs[qs.length - 1].num}` : `${qs[0].num}`;

    <div class="xrq">${rq.map(q => `<button class="${x.ans[q.num] === q.ans ? 'correct' : 'wrong'}" data-src="${q.src}" title="ตอบ ${x.ans[q.num] || '—'} · เฉลย ${q.ans}">${q.num}<small>${x.ans[q.num] || '—'}${x.ans[q.num] === q.ans ? '' : '→' + q.ans}</small></button>`).join('')}</div>
    ${wq.map(q => `<div class="xwr"><b>${q.num} · ${q.kind}</b><p class="xwp">${esc(q.prompt)}</p><div class="xessay">${esc(x.ans[q.num] || '（未作答）')}</div>
      <p class="xwc2">${(x.ans[q.num] || '').replace(/\s/g, '').length} 字 · 至少 ${q.min} 字</p>
      ${x.ans[q.num] ? xBtn('xg-b' + q.num, 'ให้ Claude ตรวจและให้คะแนน', 'secondary') : ''}<div id="xg${q.num}"></div></div>`).join('')}</div>`,
    xBtn('xHomeB', '返回首页'), { cls: 'xres-s' }));
  $('xHomeB').onclick = xHome;
  const pid = x.pid, ans = { ...x.ans };
  if (PAPERS[pid]) $('xov').querySelectorAll('[data-src]').forEach(b => b.onclick = () => { const i = PAPERS[pid].items.findIndex(it => it.n === +b.dataset.src); xClose(); setPaper(pid); setMode('learn'); goQ(i); });
  wq.forEach(q => { const b = $('xg-b' + q.num); if (b) b.onclick = () => xGrade(q, ans[q.num], b); });
}
// Claude marks the writing against the HSK 6 band descriptors and explains in Thai
async function xGrade(q, text, btn) {
  const out = $('xg' + q.num), sample = await samplePromise;
  if (!sample) { out.innerHTML = '<p class="xwc2">ต้องเปิดหน้านี้ใน Claude จึงจะให้ Claude ตรวจได้</p>'; return; }
  btn.disabled = true; out.innerHTML = '<p class="xwc2">Claude กำลังตรวจ อาจใช้เวลาครึ่งนาทีถึงหนึ่งนาที…</p>';
  try {
    const r = await sample.json(`你是HSK六级写作阅卷老师。题型：${q.kind}（不少于${q.min}字）。
题目：${q.prompt}
考生作文：
${text}
请按HSK六级标准评分（0-100），从内容是否切题完整、结构是否清楚、词汇语法是否准确丰富、字数是否达标四方面评价。
只回答JSON：{"score":0,"band":"优秀/良好/及格/不及格","strengths":["用泰语写的优点"],"fixes":[{"wrong":"原句片段","right":"修改后","why":"用泰语解释"}],"comment":"用泰语写的总体建议","model":"一段更好的示范开头（中文，约80字）"}`, { modelTier: 'default', cache: false });
    const sc = Math.max(0, Math.min(100, Number(r.score) || 0));
    out.innerHTML = `<div class="xgb"><b>${sc} / 100 · ${esc(r.band || '')}</b>
      ${(r.strengths || []).length ? `<p>👍 ${r.strengths.map(esc).join(' · ')}</p>` : ''}
      ${(r.fixes || []).slice(0, 6).map(f => `<p class="xfix"><s>${esc(f.wrong || '')}</s> → <b>${esc(f.right || '')}</b><br><small>${esc(f.why || '')}</small></p>`).join('')}
      ${r.comment ? `<p>${esc(r.comment)}</p>` : ''}${r.model ? `<p class="xmodel">示范：${esc(r.model)}</p>` : ''}</div>`;
    const ws = $('xWscore'); if (ws) ws.textContent = sc + ' / 100';
  } catch (e) {
    btn.disabled = false;
    out.innerHTML = `<p class="xwc2">${e.code === 'not_granted' ? 'ไม่ได้อนุญาตให้ใช้ Claude' : e.code === 'rate_limited' ? 'ใช้ Claude ถี่เกินไป ลองใหม่ภายหลัง' : 'ตรวจไม่สำเร็จ ลองกดอีกครั้ง'}</p>`;
  }
}

/* ───────────── shell ───────────── */
function setMode(m) {
  mode = m;
  $('modeLearn').setAttribute('aria-pressed', m === 'learn');
  $('modeExam').setAttribute('aria-pressed', m === 'exam');
  $('modeGame').setAttribute('aria-pressed', m === 'game');
  $('modeVocab').setAttribute('aria-pressed', m === 'vocab');
  $('modeMem').setAttribute('aria-pressed', m === 'mem');
  $('modeFam').setAttribute('aria-pressed', m === 'fam');
  if (fm) clearTimeout(fm.t); fm = null; ftStop();
  setAuto(false); stopSpeech(); stopGameTimer(); stopDrill(); drill = null; stopLv(); lv = null; stopVocab(); vc = null; memStop(); mem = null; xStop(); x = null; closeModal();
  $('barGame').hidden = true;
  if (m !== 'exam') { stopTimer(); if (ex && ex.phase !== 'result') saveExam(); }
  if (m === 'learn') {
    $('barLearn').hidden = false; $('barExam').hidden = true;
    buildNav(); step = 0; renderLearn(true);
  } else if (m === 'game') {
    gameIntro();
  } else if (m === 'vocab') {
    vocabIntro();
  } else if (m === 'mem') {
    memHome();
  } else if (m === 'fam') {
    famIntro();
  } else {
    xHome();
  }
}
function setPaper(id) {
  stopTimer(); ex = null;
  paperId = id; store.set('hsk.paper', id);
  idx = store.get('hsk.idx.' + id, 0); step = 0;
  seen = new Set(store.get('hsk.seen.' + id, []));
  buildPapers();
  setMode(mode);
}
function buildPapers() {
  $('papers').innerHTML = LIST.map(id =>
    `<button class="paper-chip" data-id="${id}" aria-pressed="${id === paperId}" ${PAPERS[id] ? '' : 'disabled title="กำลังเตรียมข้อมูล"'}>${paperName(id)}</button>`).join('');
}
function buildNav() {
  const groups = [['语病', 'error'], ['选词', 'fill'], ['选句', 'sent'], ['阅读', 'read'], ['书写', 'write']];
  const items = paper().items;
  $('qnav').innerHTML = groups.map(([label, t]) => {
    const btns = items.map((it, i) => it.type === t ? `<button class="qbtn" data-i="${i}">${it.n}</button>` : '').join('');
    return btns ? `<div class="qgroup"><span>${label}</span>${btns}</div>` : '';
  }).join('');
}

$('papers').onclick = e => { const b = e.target.closest('.paper-chip'); if (b && !b.disabled && b.dataset.id !== paperId) setPaper(b.dataset.id); };
$('modeLearn').onclick = () => mode !== 'learn' && setMode('learn');
$('modeExam').onclick = () => mode !== 'exam' && setMode('exam');
$('modeGame').onclick = () => mode !== 'game' && setMode('game');
$('modeVocab').onclick = () => mode !== 'vocab' && setMode('vocab');
$('modeMem').onclick = () => mode !== 'mem' && setMode('mem');
$('modeFam').onclick = () => mode !== 'fam' && setMode('fam');
$('notes').addEventListener('click', e => {
  const s = e.target.closest('[data-say]'); if (s) return tts(s.dataset.say, 0.85);
  const z = e.target.closest('[data-zhx]'); if (z) return aiZhExplain(z);
  const tr = e.target.closest('[data-trans]'); if (tr) aiTranslate(tr);
});
$('gQuit').onclick = () => gameIntro();
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('lvModal')) { closeModal(); gameIntro(); } });
$('gNext').onclick = () => {
  if (drill) return drill.kind === 'colloc' ? (drill.answered && nextCard()) : scanNext();
  if (gm && gm.revealed) nextGameQ();
};
$('qnav').onclick = e => {
  const b = e.target.closest('.qbtn'); if (!b) return;
  if (mode === 'learn') { setAuto(false); goQ(+b.dataset.i); }
  else if (ex && ex.phase === 'reading') exGo(ex.order.indexOf(+b.dataset.n));
};
function pickOpt(k) {
  if (mode === 'game') return gamePick(k);
  if (mode === 'exam' && ex && ex.phase === 'reading') choose(k);
}
$('content').addEventListener('click', e => {
  if (lv) { const s = e.target.closest('.sent'); if (s) lvScanClick(+s.dataset.s); return; }
  if (drill) { const s = e.target.closest('.sent'); if (s && drill.kind === 'scan') scanClick(+s.dataset.s); return; }
  const o = e.target.closest('.opt[data-k]'); if (o) pickOpt(o.dataset.k);
});
$('content').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const o = e.target.closest('.opt[data-k]'); if (o) { e.preventDefault(); e.stopPropagation(); pickOpt(o.dataset.k); }
});
$('next').onclick = () => { setAuto(false); nextAction(); };
$('back').onclick = () => { setAuto(false); goStep(step - 1); };
$('prevQ').onclick = () => { setAuto(false); goQ(idx - 1); };
$('nextQ').onclick = () => { setAuto(false); goQ(idx + 1); };
$('auto').onclick = () => setAuto(!autoOn);
$('voice').onclick = () => setVoice(!voiceOn);
$('exPrev').onclick = () => exGo(ex.pos - 1);
$('exNext').onclick = () => {
  if (ex.pos < ex.order.length - 1) return exGo(ex.pos + 1);
  const firstOpen = ex.order.findIndex(m => !ex.answers[m] || ex.flags.includes(m));
  if (firstOpen >= 0 && firstOpen !== ex.pos) exGo(firstOpen);
};
$('exFlag').onclick = () => {
  const n = ex.order[ex.pos];
  ex.flags = ex.flags.includes(n) ? ex.flags.filter(x => x !== n) : [...ex.flags, n];
  saveExam(); renderExamQ(false);
};
let submitArmed = false;
$('exSubmit').onclick = () => {
  const open = ex.order.length - Object.keys(ex.answers).length;
  if (open && !submitArmed) {
    submitArmed = true;
    $('exSubmit').textContent = `ยังว่าง ${open} ข้อ · กดอีกครั้งเพื่อส่ง`;
    setTimeout(() => { submitArmed = false; $('exSubmit').textContent = 'ส่งคำตอบ'; }, 4000);
    return;
  }
  submitArmed = false; $('exSubmit').textContent = 'ส่งคำตอบ';
  finishReading();
};
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (mode === 'game') return gameKey(e);
  if (mode === 'vocab') return vocabKey(e);
  if (mode === 'mem') return memKey(e);
  if (mode === 'fam') return famKey(e);
  if (mode === 'exam') {
    if (!ex || ex.phase !== 'reading') return;
    if (/^[a-eA-E]$/.test(k)) choose(k.toUpperCase());
    else if (k === 'ArrowRight') exGo(ex.pos + 1);
    else if (k === 'ArrowLeft') exGo(ex.pos - 1);
    else if (k === 'f' || k === 'F') $('exFlag').click();
    return;
  }
  if (k === ' ' || k === 'ArrowRight') { e.preventDefault(); setAuto(false); nextAction(); }
  else if (k === 'ArrowLeft') { setAuto(false); goStep(step - 1); }
  else if (k === 'n' || k === 'N' || k === 'PageDown') { setAuto(false); goQ(idx + 1); }
  else if (k === 'p' || k === 'P' || k === 'PageUp') { setAuto(false); goQ(idx - 1); }
  else if (k === 'a' || k === 'A') setAuto(!autoOn);
  else if (k === 'v' || k === 'V') setVoice(!voiceOn);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) saveExam(); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => mode === 'vocab' ? vc && vcDraw() : mode !== 'exam' && drawInk(false, mode === 'game'), 120); });
document.fonts?.ready.then(() => mode === 'learn' && drawInk(false));

buildPapers(); buildNav();
if (idx >= paper().items.length) idx = 0;
$('voice').setAttribute('aria-pressed', voiceOn ? 'true' : 'false');
$('voice').textContent = voiceOn ? 'เสียงอธิบาย: เปิด' : 'เสียงอธิบาย: ปิด';
renderLearn(true);
</script>
